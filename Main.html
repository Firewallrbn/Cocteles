<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SabanaCoctel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>SabanaCoctel</h1>
  </header>

  <!-- Contenedor principal para el contenido y la barra lateral -->
  <div id="container">
    <main>
      <!-- Botón para obtener un cóctel aleatorio -->
      <button id="buscar-aleatorio">Random</button>

      <!-- Sección donde se muestra la información del cóctel seleccionado -->
      <section id="resultado">
        <p>Pulsa "Random" para obtener un cóctel aleatorio.</p>
      </section>

      <!-- Loader o indicador de progreso -->
      <div id="loader" style="display: none;"></div>
    </main>

    <!-- Barra lateral para mostrar los favoritos -->
    <aside id="favoritos-container">
      <h2>Favoritos</h2>
      <!-- Lista de favoritos -->
      <ul id="lista-favoritos">
        <!-- Aquí se inyectarán dinámicamente los favoritos -->
      </ul>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
